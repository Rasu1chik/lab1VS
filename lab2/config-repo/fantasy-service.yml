server:
  port: 8082
spring:
  datasource:
    url: jdbc:postgresql://${FANTASY_DB_HOST:localhost}:5432/fantasy
    username: ${DB_USER:fantasy}
    password: ${DB_PASSWORD:fantasy}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
game:
  initial-budget: ${GAME_INITIAL_BUDGET:100.0}
  max-players-per-club: ${GAME_MAX_PLAYERS_PER_CLUB:3}
